upstream nco{
    server nco_backend:8080;
}

map $host $frontend_root {
    # 10.2.92.92 T:\app_backup\Web_App/web_sesrver_nginx/front_dist/dist/;
    afrad.oma.mil.eg /usr/share/nginx/html/out/dist/;
    afrad.mil.eg /usr/share/nginx/html/;
    www.afrad.mil.eg /usr/share/nginx/html/dist/;
    # localhost T:/app_backup/Web_App/web_sesrver_nginx/production_dist/out/dist/;
    default /usr/share/nginx/html/;
    # ~^.+\.afrad\.mil\.eg$ T:/app_backup/Web_App/web_sesrver_nginx/production_dist/dist/;
}
sendfile        on;
charset utf-8;

server {
    listen 80;
    server_name localhost 10.2.92.92 www.afrad.mil.eg afrad.mil.eg afrad.* *.afrad.* afrad.oma.eg afrad.oma.mil afrad.oma.mil.eg; 
    return 301 https://$host$request_uri;
    include       mime.types;
}


server {
    listen 443 ssl;
    server_name localhost 10.2.92.92 www.afrad.mil.eg *.afrad.mil.eg afrad.mil.eg *.afrad.oma.mil *.afrad.* afrad.oma.mil afrad.* *.afrad afrad.oma.mil afrad.oma.mil.eg;

    client_max_body_size 5M;
    # ssl_certificate ../new_cert/afrad.mil.eg.crt;
    # ssl_certificate_key ../new_cert/afrad.mil.eg.key;
#ssl_certificate ../new_cert/server.crt;
#ssl_certificate_key ../new_cert/server.key;
    ssl_certificate /etc/certs/cert.pem;
    ssl_certificate_key /etc/certs/key.pem;

    include       mime.types;
    default_type  application/octet-stream;

    #ssl_certificate ../certification/certification.crt;
    #ssl_certificate_key  ../certification/key.key;

    # for (HSTS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # for (XCTO)
    add_header X-Content-Type-Options "nosniff" always;

    # root T:/app_backup/Web_App/web_sesrver_nginx/production_dist/dist/;
    root $frontend_root;
    
    location /admin/ {
        proxy_pass http://nco;   # Daphne backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # location /assets/ {
    #     alias T:/app_backup/Web_App/web_sesrver_nginx/production_dist/dist/assets/;
    #     try_files $uri =404;
    # }

    # --- 2️⃣ Proxy API requests to Django ---
    location /api/ {
        proxy_pass http://nco;   # Daphne backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # for HSTS

        # optional
        # add_header Access-Control-Allow-Origin $http_origin;
        # add_header Access-Control-Allow-Credentals true;
    }

    # --- 3️⃣ Proxy WebSockets to Daphne (Channels) ---
    location /wss/ {
        proxy_pass http://nco;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # --- 4️⃣ (Optional) Serve Django static/media if needed ---
    location /static/ {
        alias /static/;

    }

    location ~ ^/images/\s+(.*)$ {
        return 301 /images/$1;
    }

    location /images/ {
        proxy_pass http://nco;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
